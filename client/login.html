<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to LifeLink — access your blood donation and request dashboard.">
  <title>Login — LifeLink</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- LifeLink Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Branding -->
    <div class="auth-brand">
      <a href="/" class="text-decoration-none">
        <h1 class="brand-logo">
          <i class="bi bi-droplet-fill"></i> LifeLink
        </h1>
      </a>
      <p class="brand-tagline">Connecting Potential Donors with Those in Need</p>
    </div>

    <!-- Login Card -->
    <div class="auth-card">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Log in to your LifeLink account</p>

      <!-- Alert container for success/error messages -->
      <div id="alertContainer"></div>

      <form id="loginForm" novalidate>
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            >
          </div>
          <div class="invalid-feedback" id="emailError"></div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              class="form-control has-toggle"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            >
            <button class="toggle-password" type="button" data-target="password" title="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback" id="passwordError"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-danger w-100 btn-auth" id="loginBtn">
          <span class="btn-text">Login</span>
          <span class="spinner-border spinner-border-sm d-none ms-2" id="loginSpinner" role="status"></span>
        </button>
      </form>

      <!-- Register link -->
      <div class="auth-footer">
        <p>Don't have an account? <a href="/register.html">Create Account</a></p>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- LifeLink JS -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    /**
     * Login Page Logic
     *
     * Flow:
     *   1. User enters email and password.
     *   2. Client-side validation runs on submit.
     *   3. jQuery AJAX sends POST /api/auth/login with JSON body.
     *   4. On success: store JWT token + user data, redirect by role.
     *   5. On error: show the server's error message.
     */
    $(document).ready(function () {

      var loginParams = new URLSearchParams(window.location.search);
      var pendingActionToken = sessionStorage.getItem('lifelink_pending_email_action');

      // Email-action login must not be redirected to a role dashboard.
      if (loginParams.get('emailAction') !== '1') {
        Auth.requireGuest();
      }

      // ---- Toggle password visibility ----
      $('.toggle-password').on('click', function () {
        var targetId = $(this).data('target');
        var input = $('#' + targetId);
        var icon = $(this).find('i');

        if (input.attr('type') === 'password') {
          input.attr('type', 'text');
          icon.removeClass('bi-eye').addClass('bi-eye-slash');
        } else {
          input.attr('type', 'password');
          icon.removeClass('bi-eye-slash').addClass('bi-eye');
        }
      });

      // ---- Clear validation errors on input ----
      $('input').on('input', function () {
        $(this).removeClass('is-invalid');
        $(this).closest('.mb-3, .mb-4').find('.invalid-feedback').text('');
      });

      // ---- Form submit ----
      $('#loginForm').on('submit', function (e) {
        e.preventDefault();

        // Clear previous alerts
        Auth.clearAlerts('alertContainer');

        // Collect values
        var email = $.trim($('#email').val());
        var password = $('#password').val();

        // ---- Client-side validation ----
        var isValid = true;

        // Email
        var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
          showFieldError('email', 'emailError', 'Email is required');
          isValid = false;
        } else if (!emailPattern.test(email)) {
          showFieldError('email', 'emailError', 'Please enter a valid email');
          isValid = false;
        }

        // Password
        if (!password) {
          showFieldError('password', 'passwordError', 'Password is required');
          isValid = false;
        }

        if (!isValid) return;

        // ---- Send login request ----
        setLoading(true);

        LifeLinkAPI.post('/auth/login', {
          email: email,
          password: password
        })
          .then(function (response) {
            setLoading(false);

            // Store the JWT token
            LifeLinkAPI.setToken(response.data.token);

            // Store user info for quick access (no sensitive data)
            Auth.setUser(response.data.user);

            // Show success
            Auth.showAlert(
              'alertContainer',
              '<strong>Login successful!</strong> Redirecting...',
              'success'
            );

            // Redirect by role after a brief delay
            setTimeout(function () {
              if (pendingActionToken) {
                sessionStorage.removeItem('lifelink_pending_email_action');
                window.location.href =
                  '/user/respond-to-request.html?token=' +
                  encodeURIComponent(pendingActionToken);
                return;
              }
              Auth.redirectByRole(response.data.user);
            }, 1000);
          })
          .catch(function (error) {
            setLoading(false);
            Auth.showAlert(
              'alertContainer',
              error.message || 'Login failed. Please try again.',
              'danger'
            );
          });
      });

      // ---- Helper: Show field-level validation error ----
      function showFieldError(fieldId, errorId, message) {
        $('#' + fieldId).addClass('is-invalid');
        $('#' + errorId).text(message).show();
      }

      // ---- Helper: Toggle loading state ----
      function setLoading(loading) {
        var btn = $('#loginBtn');
        var spinner = $('#loginSpinner');
        var btnText = btn.find('.btn-text');

        if (loading) {
          btn.prop('disabled', true);
          btnText.text('Logging in...');
          spinner.removeClass('d-none');
        } else {
          btn.prop('disabled', false);
          btnText.text('Login');
          spinner.addClass('d-none');
        }
      }
    });
  </script>
</body>
</html>
